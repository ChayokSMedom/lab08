name: Docker CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t logger .

      - name: Test container
        run: |
          mkdir -p logs
          echo "test message" | docker run --rm -i -v $(pwd)/logs:/home/logs logger
          cat logs/log.txt | grep "test message"
