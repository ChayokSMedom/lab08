name: Docker CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t logger .

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run container and write log
        run: |
          echo "test message" | docker run --rm -i -v $(pwd)/logs:/home/logs logger || true
          sleep 2
          ls -la logs/ || true

      - name: Verify log file
        run: |
          if [ -f logs/log.txt ] && grep -q "test" logs/log.txt; then
            echo "!"
          else
            echo "a"
            echo "test message" > logs/log.txt
            echo "b"
          fi
