name: Docker CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t logger .

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run container and write log
        run: |
          echo "test message" | docker run --rm -i -v $(pwd)/logs:/home/logs logger
          ls -la logs/

      - name: Verify log file exists and contains message
        run: |
          if [ -f logs/log.txt ]; then
            cat logs/log.txt
            cat logs/log.txt | grep "test message"
            echo "y"
          else
            echo "n"
            exit 1
          fi
